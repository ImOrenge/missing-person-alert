services:
  - type: web
    name: missing-person-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SAFE182_ESNTL_ID
        sync: false
      - key: SAFE182_AUTH_KEY
        sync: false
      - key: API_POLL_INTERVAL_MINUTES
        value: 10
