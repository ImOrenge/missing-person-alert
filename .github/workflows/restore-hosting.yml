name: Restore pre-incident Hosting release
on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-hosting.yml]
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --prefix functions --no-audit --no-fund
      - name: Restore verified original production version
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MISSING_PERSON_ALRAM }}
        run: node scripts/restore-pre-incident-hosting.cjs
