name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Verify frontend runtime secrets
        env:
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
          REACT_APP_MAP_ID: ${{ secrets.REACT_APP_MAP_ID }}
        run: |
          test -n "$REACT_APP_GOOGLE_MAPS_API_KEY" || { echo "Missing REACT_APP_GOOGLE_MAPS_API_KEY repository secret"; exit 1; }
          test -n "$REACT_APP_MAP_ID" || { echo "Missing REACT_APP_MAP_ID repository secret"; exit 1; }
      - name: Build frontend
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
          REACT_APP_MAP_ID: ${{ secrets.REACT_APP_MAP_ID }}
          REACT_APP_RECAPTCHA_SITE_KEY: ${{ secrets.REACT_APP_RECAPTCHA_SITE_KEY }}
          REACT_APP_FIREBASE_VAPID_KEY: ${{ secrets.REACT_APP_FIREBASE_VAPID_KEY }}
        run: npm run build --prefix frontend
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MISSING_PERSON_ALRAM }}
          channelId: live
          projectId: missing-person-alram
